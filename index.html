」","文化形成于关键时刻的选择：奖励了什么、容忍了什么","强文化降低管理成本，但也可能压制不同意见"],tasks:["观察一个你熟悉的集体（宿舍、社团、班级）：写出三条「不成文但大家都遵守」的规矩，并说说它们是怎么来的。"],readings:["《组织文化与领导力》 埃德加·沙因"]},{id:"ch-lead",name:"领导",bookRef:"教材第八章",stage:1,coreQuestion:"",logicSummary:"（尚未形成）",nextStep:"确定本章学生问题",caseIds:[],updatedAt:Pe(4),intro:"没有职位，能不能影响别人？领导力的起点不是权力，是别人愿不愿意跟你走。",points:["影响力的来源：职位给的权力，和个人赢得的信任","激励的关键不是钱：被看见、有意义、有成长","对不同状态的人用不同方式：新手要指令，熟手要空间"],tasks:["回忆一次你被真正激励到的经历：对方做了什么？换成是你带团队，你会怎么复制这件事？"],readings:["《一分钟经理人》 肯·布兰佳"]},{id:"ch-control",name:"控制",bookRef:"教材第十章",stage:1,coreQuestion:"",logicSummary:"（尚未形成）",nextStep:"确定本章学生问题",caseIds:[],updatedAt:Pe(5),intro:"计划定了、人安排了，怎么知道事情在往对的方向走？控制不是监视，是反馈。",points:["控制三步：定标准 → 量结果 → 纠偏差","结果控制看终点，过程控制看沿途——重要的事两者都要","好的控制让人更自主，坏的控制让人只为指标干活"],tasks:["给你正在做的一件事（如备考）设计一个每周十分钟就能完成的自检机制。"],readings:["《第五项修炼》 彼得·圣吉"]},{id:"ch-innovation",name:"创新",bookRef:"教材第十二章",stage:1,coreQuestion:"",logicSummary:"（尚未形成）",nextStep:"确定本章学生问题",caseIds:[],updatedAt:Pe(6),intro:"创新不是天才的专利，是对「不方便」保持敏感，并把不满变成方案。",points:["创新的来源往往很朴素：抱怨、意外、习惯的改变","组织能做的是降低试错的成本，而不是命令创新","先小步验证，再放大投入"],tasks:["在校园里找一个让你觉得「不方便」的地方，提出一个具体可试的改进方案。"],readings:["《创新者的窘境》 克莱顿·克里斯坦森"]}],notes:[{id:"n1",chapterId:"ch-plan",body:"支持性条件和限制性条件应该怎样判断？",status:"discuss",createdAt:Pe(0),updatedAt:Pe(0),caseIds:["c-cet4"],nodeIds:["ln-cond"]}],cases:[{id:"c-cet4",title:"英语四级备考",kind:"教学假设",background:"大一学生，距离四级考试还有三个月。",facts:"",basis:"目标：425 分通过。条件：时间、词汇量、听力基础。路径：摸底 → 按题型分配时间。",action:"",later:"学生容易把「每天学多久」当成计划，其实那只是路径，不是目标。",pendingInfo:"",createdAt:Pe(2)}],nodes:[{id:"ln-root",chapterId:"ch-plan",parentId:null,text:"制定计划 → 执行 → 检查 → 复盘",order:0,collapsed:!1,caseIds:[]},{id:"ln-make",chapterId:"ch-plan",parentId:"ln-root",text:"制定计划：三个问题",order:0,collapsed:!1,caseIds:[]},{id:"ln-goal",chapterId:"ch-plan",parentId:"ln-make",text:"目标：我要实现什么？",order:0,collapsed:!1,caseIds:["c-cet4"]},{id:"ln-cond",chapterId:"ch-plan",parentId:"ln-make",text:"条件：有什么？什么影响？怎么办？",order:1,collapsed:!1,caseIds:["c-cet4"]},{id:"ln-path",chapterId
